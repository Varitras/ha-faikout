version: 2
updates:
  # Monthly and grouped: one pull request for all action bumps. The test
  # workflow runs on pull_request, so every bump arrives already verified.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Only the pinned check tools. requirements-test.txt carries a floor
  # (pytest>=8.0), not a pin, and the Home Assistant and phcc releases each lane
  # installs live in the workflow matrix: those stay a manual decision, since the
  # lanes deliberately test the current, the minimum and the upcoming release.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: mypy
      - dependency-name: pytest-cov
      - dependency-name: ruff
      - dependency-name: vulture
    groups:
      check-tools:
        patterns: ["*"]
