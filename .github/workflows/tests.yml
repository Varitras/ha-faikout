name: Tests

# A pull request is what proves a branch; the push trigger covers the merge
# commit and the release revision on master. A feature branch is therefore
# checked once, not once on push and again on its pull request.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Both rows should always report; one failing must not hide the other.
      fail-fast: false
      matrix:
        include:
          # The current stable Home Assistant. Pinned on purpose: an unpinned
          # pytest-homeassistant-custom-component tracks the newest release
          # including betas, so this lane would gate releases on a prerelease.
          # Bump when a new stable lands (0.13.363 pins 2026.9.0).
          - label: current HA 2026.9
            python-version: "3.14"
            phcc: "==0.13.363"
            coverage: "--cov=custom_components/faikout --cov-fail-under=90"
          # Newest release including betas. Advisory: it warns about upcoming
          # breakage without letting a Home Assistant prerelease block a fix.
          - label: upcoming HA (advisory)
            python-version: "3.14"
            phcc: ""
            coverage: ""
            advisory: true
          # Guards the minimum version claimed in hacs.json and the README.
          # Each pytest-homeassistant-custom-component release pins exactly one
          # Home Assistant version, so the minimum is selected by pinning phcc:
          # 0.13.354 pins homeassistant 2026.8.0, the first release providing
          # device_registry.async_get_device_by_identifier, which the coordinator
          # requires. That HA needs Python 3.14.2, hence the paired version.
          - label: minimum HA 2026.8
            python-version: "3.14"
            phcc: "==0.13.354"
            coverage: ""
    continue-on-error: ${{ matrix.advisory == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-homeassistant-custom-component pulls in a matching
          # homeassistant and provides the `hass` fixture the integration tests
          # need; paho-mqtt is needed for the own-MQTT transport test.
          pip install "pytest-homeassistant-custom-component${{ matrix.phcc }}" paho-mqtt
          pip install pytest-cov
      - name: Show versions under test
        run: pip show homeassistant pytest-homeassistant-custom-component | grep -E "^(Name|Version)"
      - name: Run tests
        # The floor sits below the current figure on purpose: it is there to
        # catch untested new code, not to make every refactor a coverage debate.
        run: python -m pytest -q ${{ matrix.coverage }}

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      # Only the linter, deliberately not `ruff format --check`: adopting the
      # formatter would reflow nearly every file at once, which buries real
      # changes in churn without making anything clearer.
      - run: ruff check .

  hassfest:
    name: hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
